<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
    <linearGradient id="iconPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="iconCrimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#iconBgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#292929" stroke-width="4" />

  <!-- Film Frame Outer Box -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="#151515" stroke="#E50914" stroke-width="4" stroke-opacity="0.5" />

  <!-- Film Perforations Top -->
  <rect x="136" y="120" width="40" height="28" rx="8" fill="#E50914" opacity="0.9" />
  <rect x="236" y="120" width="40" height="28" rx="8" fill="#E50914" opacity="0.9" />
  <rect x="336" y="120" width="40" height="28" rx="8" fill="#E50914" opacity="0.9" />

  <!-- Film Perforations Bottom -->
  <rect x="136" y="364" width="40" height="28" rx="8" fill="#E50914" opacity="0.9" />
  <rect x="236" y="364" width="40" height="28" rx="8" fill="#E50914" opacity="0.9" />
  <rect x="336" y="364" width="40" height="28" rx="8" fill="#E50914" opacity="0.9" />

  <!-- Central Large Play Symbol -->
  <polygon points="224,196 224,316 324,256" fill="url(#iconPlayGrad)" filter="url(#iconCrimsonGlow)" />
</svg>
