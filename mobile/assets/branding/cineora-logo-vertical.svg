<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cineoraRedGradVert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="crimsonGlowVert" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Film Strip Frame with Play Button Icon Centered -->
  <g transform="translate(100, 40)">
    <rect x="0" y="0" width="160" height="160" rx="34" fill="#151515" stroke="#292929" stroke-width="2.5" />
    
    <!-- Film Perforation Slots Top & Bottom -->
    <rect x="22" y="14" width="20" height="14" rx="4" fill="#E50914" opacity="0.85" />
    <rect x="70" y="14" width="20" height="14" rx="4" fill="#E50914" opacity="0.85" />
    <rect x="118" y="14" width="20" height="14" rx="4" fill="#E50914" opacity="0.85" />

    <rect x="22" y="132" width="20" height="14" rx="4" fill="#E50914" opacity="0.85" />
    <rect x="70" y="132" width="20" height="14" rx="4" fill="#E50914" opacity="0.85" />
    <rect x="118" y="132" width="20" height="14" rx="4" fill="#E50914" opacity="0.85" />

    <!-- Central Glowing Play Polygon -->
    <polygon points="66,54 66,106 112,80" fill="url(#cineoraRedGradVert)" filter="url(#crimsonGlowVert)" />
  </g>

  <!-- Brand Typography -->
  <text x="180" y="270" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="4">
    CINE<tspan fill="#E50914">ORA</tspan>
  </text>

  <!-- Slogan -->
  <text x="180" y="310" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="15" fill="#A3A3A3" letter-spacing="3.5">
    YOUR CINEMA. EVERYWHERE.
  </text>
</svg>
