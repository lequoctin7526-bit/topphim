<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="splashVignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A0506" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#090909" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="splashPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF242E" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="splashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cinema OLED Background -->
  <rect width="1080" height="1920" fill="#090909" />
  <rect width="1080" height="1920" fill="url(#splashVignette)" />

  <!-- Center Stage Logo Composition -->
  <g transform="translate(540, 880)">
    <!-- Film Perforation Icon -->
    <g transform="translate(-110, -160)">
      <rect x="0" y="0" width="220" height="220" rx="48" fill="#151515" stroke="#292929" stroke-width="3" />
      
      <rect x="30" y="20" width="28" height="20" rx="6" fill="#E50914" opacity="0.9" />
      <rect x="96" y="20" width="28" height="20" rx="6" fill="#E50914" opacity="0.9" />
      <rect x="162" y="20" width="28" height="20" rx="6" fill="#E50914" opacity="0.9" />

      <rect x="30" y="180" width="28" height="20" rx="6" fill="#E50914" opacity="0.9" />
      <rect x="96" y="180" width="28" height="20" rx="6" fill="#E50914" opacity="0.9" />
      <rect x="162" y="180" width="28" height="20" rx="6" fill="#E50914" opacity="0.9" />

      <polygon points="90,75 90,145 150,110" fill="url(#splashPlayGrad)" filter="url(#splashGlow)" />
    </g>

    <!-- Brand Typography -->
    <text x="0" y="150" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="6">
      CINE<tspan fill="#E50914">ORA</tspan>
    </text>

    <!-- Slogan -->
    <text x="0" y="205" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="22" fill="#A3A3A3" letter-spacing="5">
      YOUR CINEMA. EVERYWHERE.
    </text>
  </g>

  <!-- Bottom Powered Badge -->
  <text x="540" y="1840" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="16" fill="#525252" letter-spacing="2">
    LICENSED STREAMING PLATFORM
  </text>
</svg>
