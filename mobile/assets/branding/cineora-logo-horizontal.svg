<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cineoraRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="filmBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.6" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Film Strip Frame with Play Button Icon -->
  <g transform="translate(30, 20)">
    <!-- Film Reel Background Rounded Rect -->
    <rect x="0" y="0" width="120" height="120" rx="26" fill="#151515" stroke="#292929" stroke-width="2" />
    
    <!-- Film Perforation Slots Top & Bottom -->
    <rect x="18" y="10" width="14" height="10" rx="3" fill="#E50914" opacity="0.85" />
    <rect x="53" y="10" width="14" height="10" rx="3" fill="#E50914" opacity="0.85" />
    <rect x="88" y="10" width="14" height="10" rx="3" fill="#E50914" opacity="0.85" />

    <rect x="18" y="100" width="14" height="10" rx="3" fill="#E50914" opacity="0.85" />
    <rect x="53" y="100" width="14" height="10" rx="3" fill="#E50914" opacity="0.85" />
    <rect x="88" y="100" width="14" height="10" rx="3" fill="#E50914" opacity="0.85" />

    <!-- Central Glowing Play Polygon -->
    <polygon points="50,40 50,80 84,60" fill="url(#cineoraRedGrad)" filter="url(#crimsonGlow)" />
  </g>

  <!-- Brand Typography -->
  <text x="180" y="88" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="4">
    CINE<tspan fill="#E50914">ORA</tspan>
  </text>

  <!-- Slogan -->
  <text x="184" y="120" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="16" fill="#A3A3A3" letter-spacing="3.5">
    YOUR CINEMA. EVERYWHERE.
  </text>
</svg>
