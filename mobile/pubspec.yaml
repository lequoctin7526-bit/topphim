name: cineora
description: "CINEORA - Professional Movie & TV Streaming Platform for iOS & Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons for iOS look & feel
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Declarative Navigation
  go_router: ^14.2.7

  # Networking & REST API
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # SVG & Image Caching
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Video Streaming Player
  video_player: ^2.8.6

  # JSON Serialization
  json_annotation: ^4.9.0

  # Google Fonts & UI Enhancements
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
