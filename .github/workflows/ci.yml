name: CINEORA CI & Release Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cineora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/cineora?schema=public"
      JWT_ACCESS_SECRET: "cineora_jwt_access_secret_production_ready_token_2026_key"
      JWT_REFRESH_SECRET: "cineora_jwt_refresh_secret_production_ready_token_2026_key"
      PLAYBACK_SIGNING_KEY: "cineora_playback_hmac_sha256_signing_key_secure_vault"
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Unit Tests
        working-directory: backend
        run: npm test

      - name: Build Production Bundle
        working-directory: backend
        run: npm run build

  mobile-quality-gate:
    name: Flutter Mobile Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

  build-android-apk:
    name: Build Android APK
    needs: [backend-test-and-build, mobile-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter Android Harness
        working-directory: mobile
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org tv.cineora --project-name cineora .
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK Output
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk cineora-release.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineora-android-apk
          path: cineora-release.apk
          if-no-files-found: error

  build-ios-ipa:
    name: Build iOS IPA
    needs: [backend-test-and-build, mobile-quality-gate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter iOS Harness
        working-directory: mobile
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org tv.cineora --project-name cineora .
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get

      - name: Build iOS Release (no codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r mobile/build/ios/iphoneos/Runner.app Payload/
          zip -r cineora-release.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineora-ios-ipa
          path: cineora-release.ipa
          if-no-files-found: error

  publish-release:
    name: Publish Release (APK & IPA)
    needs: [build-android-apk, build-ios-ipa]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: cineora-android-apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: cineora-ios-ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "CINEORA v1.0.0 - Production Release (APK & IPA)"
          draft: false
          prerelease: false
          body: |
            ## CINEORA Streaming Platform v1.0.0 - Production Release

            ### 📲 Tải ứng dụng / Download Builds:
            - 🤖 **Android APK:** [`cineora-release.apk`](https://github.com/lequoctin7526-bit/topphim/releases/download/v1.0.0/cineora-release.apk) (Cài trực tiếp trên điện thoại Android, Android TV hoặc Emulator)
            - 🍏 **iOS IPA:** [`cineora-release.ipa`](https://github.com/lequoctin7526-bit/topphim/releases/download/v1.0.0/cineora-release.ipa) (Cài đặt qua AltStore, Sideloadly, TrollStore hoặc Apple Configurator)

            ---
            ### ✨ Tính năng nổi bật:
            - **Dark Cinema Theme:** Giao diện chuẩn điện ảnh OLED (#090909, #E50914).
            - **Trình phát HLS Streaming:** Tua 10s, chọn chất lượng (1080p, 720p), phụ đề tiếng Việt & âm thanh vòm.
            - **Tiếp tục xem:** Tự động ghi nhớ vị trí phát và đồng bộ đa thiết bị.
            - **Khám phá & Tìm kiếm:** Lọc đa chiều theo quốc gia, thể loại; tìm kiếm tiếng Việt không dấu.
            - **Tài khoản & Bản quyền:** Xác thực JWT an toàn, bảo vệ luồng phát bằng chữ ký HMAC có thời hạn.
          files: |
            cineora-release.apk
            cineora-release.ipa
