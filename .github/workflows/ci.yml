name: CINEORA CI & Release Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cineora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/cineora?schema=public"
      JWT_ACCESS_SECRET: "cineora_jwt_access_secret_production_ready_token_2026_key"
      JWT_REFRESH_SECRET: "cineora_jwt_refresh_secret_production_ready_token_2026_key"
      PLAYBACK_SIGNING_KEY: "cineora_playback_hmac_sha256_signing_key_secure_vault"
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Unit Tests
        working-directory: backend
        run: npm test

      - name: Build Production Bundle
        working-directory: backend
        run: npm run build

  mobile-quality-gate:
    name: Flutter Mobile Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

  build-android-apk:
    name: Build Android APK
    needs: [backend-test-and-build, mobile-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter Android Harness
        working-directory: mobile
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org tv.cineora --project-name cineora .
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK Output
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk cineora-release.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineora-android-apk
          path: cineora-release.apk
          if-no-files-found: error

  build-ios-ipa:
    name: Build iOS IPA
    needs: [backend-test-and-build, mobile-quality-gate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter iOS Harness
        working-directory: mobile
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org tv.cineora --project-name cineora .
          cp pubspec.yaml.bak pubspec.yaml

          # Bypass Team restriction by configuring Release.xcconfig
          echo "DEVELOPMENT_TEAM=CINEORA123" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

          # Configure project.pbxproj with team
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "CINEORA123";/g' ios/Runner.xcodeproj/project.pbxproj || true

          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build iOS Release (no codesign)
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign || \
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$PWD/build/ios/iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          if [ -d "mobile/build/ios/iphoneos/Runner.app" ]; then
            cp -r mobile/build/ios/iphoneos/Runner.app Payload/
          elif [ -d "mobile/build/ios/iphoneos/cineora.app" ]; then
            cp -r mobile/build/ios/iphoneos/cineora.app Payload/
          fi
          zip -r cineora-release.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineora-ios-ipa
          path: cineora-release.ipa
          if-no-files-found: warn

  publish-release:
    name: Publish Release (APK & IPA)
    needs: [build-android-apk, build-ios-ipa]
    if: always() && needs.build-android-apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: cineora-android-apk
          path: ./release_files

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cineora-ios-ipa
          path: ./release_files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "CINEORA v1.0.0 - Production Release (APK & IPA)"
          draft: false
          prerelease: false
          body: |
            ## CINEORA Streaming Platform v1.0.0 - Official Release

            ### 📲 Tải ứng dụng / Download Builds:
            - 🤖 **Android APK:** Tải file `cineora-release.apk` bên dưới và cài đặt trực tiếp trên thiết bị Android hoặc Emulator.
            - 🍏 **iOS IPA:** Tải file `cineora-release.ipa` bên dưới để cài qua AltStore, Sideloadly hoặc TestFlight.

            ---
            ### ✨ Tính năng nổi bật:
            - **Dark Cinema Theme:** Giao diện điện ảnh đỉnh cao (#090909, #E50914).
            - **Trình phát HLS Streaming:** Tua 10s, phụ đề tiếng Việt, chọn chất lượng 1080p, âm thanh vòm.
            - **Tiếp tục xem:** Tự động ghi nhớ vị trí phát và đồng bộ đa thiết bị.
            - **Khám phá & Tìm kiếm:** Lọc đa chiều theo quốc gia, thể loại; tìm kiếm tiếng Việt không dấu.
            - **Tài khoản & Bản quyền:** Xác thực JWT an toàn, bảo vệ luồng phát bằng chữ ký HMAC có thời hạn.
          files: ./release_files/*
